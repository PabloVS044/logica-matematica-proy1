[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluador"
version = "0.1.0"
description = "Evaluador semántico de fórmulas de lógica de primer orden en interpretaciones finitas"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evaluador = ["py.typed", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["evaluador"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Los símbolos lógicos y matemáticos Unicode (∨, ∪, ℒ, …) son intencionales.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["evaluador"]
strict = true
